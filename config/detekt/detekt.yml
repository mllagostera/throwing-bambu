# Parte de la configuración por defecto de detekt (buildUponDefaultConfig = true).
# Aquí solo van las desviaciones justificadas.
build:
  maxIssues: 0

complexity:
  LongParameterList:
    # simulate(scenario, shooter, shot, wind, scratch) es la firma del contrato (§8).
    functionThreshold: 6
    constructorThreshold: 8
  NestedBlockDepth:
    # Los barridos de calibración recorren ángulo x potencia x viento: el anidamiento
    # es el propio espacio de prueba, no complejidad accidental.
    excludes: ['**/test/**']

naming:
  MatchingDeclarationName:
    # Los nombres de fichero los fija la especificación: GameConstants.kt contiene `object G`.
    active: false

  FunctionNaming:
    # Los @Composable van en PascalCase por convención de Compose.
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    # Las constantes del juego viven en GameConstants.kt; en tests y render los
    # literales geométricos son legibles tal cual. En Rng.kt y Trig.kt los números
    # *son* el algoritmo (desplazamientos de xorshift, 2^24, grados a radianes):
    # bautizarlos lo haría menos legible, no más.
    excludes: ['**/test/**', '**/render/**', '**/Rng.kt', '**/Trig.kt']
  MaxLineLength:
    maxLineLength: 120
