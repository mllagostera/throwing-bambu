# Builds on detekt's default configuration (buildUponDefaultConfig = true).
# Only justified deviations live here.
build:
  maxIssues: 0

complexity:
  LongParameterList:
    # simulate(scenario, shooter, shot, wind, scratch) is the contract signature (§8).
    functionThreshold: 6
    constructorThreshold: 8
  NestedBlockDepth:
    # The calibration sweeps walk angle x power x wind: the nesting is the test space
    # itself, not accidental complexity.
    excludes: ['**/test/**']

naming:
  MatchingDeclarationName:
    # File names are fixed by the specification: GameConstants.kt holds `object G`.
    active: false

  FunctionNaming:
    # @Composable functions are PascalCase by Compose convention.
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    # Game constants live in GameConstants.kt; in tests and in the renderer the
    # geometric literals read fine as they are. In Rng.kt and Trig.kt the numbers *are*
    # the algorithm (xorshift shifts, 2^24, degrees to radians): naming them would make
    # the code less readable, not more.
    excludes: ['**/test/**', '**/render/**', '**/Rng.kt', '**/Trig.kt']
  MaxLineLength:
    maxLineLength: 120
