org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# Parallel IDE sync: Gradle builds the tooling models concurrently, which speeds up
# "Sync Project with Gradle Files" rather than anything on the command line.
#
# Introduced in Gradle 9.4. It defaults to org.gradle.parallel, which is true three lines
# up, so this line changes nothing on its own. It earns its place only if parallel task
# execution is ever turned off while a parallel sync is still wanted.
org.gradle.tooling.parallel=true
