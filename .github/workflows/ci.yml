name: CI

# A branch with an open pull request used to run this twice over: once for the push
# and once for the pull request. The concurrency group below cannot collapse the pair,
# because a push is `refs/heads/<branch>` and a pull request is `refs/pull/<n>/merge` --
# different groups, so neither cancels the other.
#
# So `push` is narrowed to the default branch and the branches are covered by
# `pull_request` alone. That is also the better of the two runs: a pull request is
# tested on the branch ALREADY MERGED into its base, which catches a change that is
# green on its own and red once it lands -- exactly what a push run cannot see.
on:
  push:
    branches: [main]
  pull_request:
  # For a branch with no pull request yet: the Android modules cannot be compiled
  # without the SDK, so CI is sometimes the first thing that type-checks a file, and
  # there has to be a way to ask for it before opening anything.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version comes from `git describe` (app/build.gradle.kts). The default
          # shallow clone carries no tags, so the APK below would be named 0.0.0-dev
          # however many releases the repository has.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Style (ktlint + detekt)
        run: ./gradlew ktlintCheck detekt

      - name: Build and run tests
        run: ./gradlew build test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

      # The APK is built in this same job, after the tests: if anything is red there is
      # no APK to download. It is the debug one, signed with the debug key and therefore
      # installable as is (`adb install`, or by opening it on the phone). The signed
      # release bundle is not built here — only a tag produces one, in release.yml.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Give the APK a recognisable name
        run: |
          set -euo pipefail
          # Asked of the build rather than read out of it: the version is derived from the
          # git tag, and a regex over the build file would find the code that derives it.
          version=$(./gradlew -q :app:printVersion | sed -n 's/^versionName=//p')
          mkdir -p artefactos
          cp app/build/outputs/apk/debug/app-debug.apk \
             "artefactos/throwing-bambu-${version}-debug-${GITHUB_SHA::7}.apk"
          size=$(du -h artefactos/*.apk | cut -f1)
          {
            echo "### Debug APK"
            echo ""
            echo "| File | Size |"
            echo "|---|---|"
            echo "| \`$(basename artefactos/*.apk)\` | $size |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: artefactos/*.apk
          retention-days: 14
          # If the APK is missing the job must fail: an empty artifact that goes green
          # is worse than a broken build.
          if-no-files-found: error

  # Determinism (§17.1) cannot be checked on a single JVM: the same fingerprint tests run
  # on Linux and on macOS. From M1 on, this is where a floating-point divergence shows up,
  # long before it would appear as a networking bug in M6.
  determinism:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: :core tests on a different JVM
        run: ./gradlew :core:test
