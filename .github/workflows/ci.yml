name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Style (ktlint + detekt)
        run: ./gradlew ktlintCheck detekt

      - name: Build and run tests
        run: ./gradlew build test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

      # The APK is built in this same job, after the tests: if anything is red there is
      # no APK to download. It is the debug one, signed with the debug key and therefore
      # installable as is (`adb install`, or by opening it on the phone). The release APK
      # needs its own keystore and arrives in M7 (T-52).
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Give the APK a recognisable name
        run: |
          set -euo pipefail
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p artefactos
          cp app/build/outputs/apk/debug/app-debug.apk \
             "artefactos/throwing-bambu-${version}-debug-${GITHUB_SHA::7}.apk"
          size=$(du -h artefactos/*.apk | cut -f1)
          {
            echo "### Debug APK"
            echo ""
            echo "| File | Size |"
            echo "|---|---|"
            echo "| \`$(basename artefactos/*.apk)\` | $size |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: artefactos/*.apk
          retention-days: 14
          # If the APK is missing the job must fail: an empty artifact that goes green
          # is worse than a broken build.
          if-no-files-found: error

  # Determinism (§17.1) cannot be checked on a single JVM: the same fingerprint tests run
  # on Linux and on macOS. From M1 on, this is where a floating-point divergence shows up,
  # long before it would appear as a networking bug in M6.
  determinism:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: :core tests on a different JVM
        run: ./gradlew :core:test
