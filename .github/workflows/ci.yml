name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Estilo (ktlint + detekt)
        run: ./gradlew ktlintCheck detekt --stacktrace

      - name: Compilar y ejecutar tests
        run: ./gradlew build test --stacktrace

      - name: Publicar informes de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-test
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  # El determinismo del §17.1 no se comprueba en una sola JVM: el mismo test de huella
  # se ejecuta en Linux y macOS. A partir de M1 aquí es donde salta una divergencia de
  # coma flotante, mucho antes de que aparezca como bug de red en M6.
  determinismo:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests de :core en una JVM distinta
        run: ./gradlew :core:test --stacktrace
