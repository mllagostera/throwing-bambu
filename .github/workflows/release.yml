name: Release

# The tag *is* the version. `app/build.gradle.kts` derives both the name and the code from
# `git describe`, and no literal anywhere in the repository names a release, so a release
# is made by pushing `vX.Y.Z` and by nothing else. The pattern below is the same shape the
# build insists on: a tag it cannot parse fails the build rather than quietly shipping
# version 0.0.0, and Play remembers a bad versionCode for the life of the app.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# Only to create the release and hang the artefacts off it. Nothing else here writes.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `git describe` needs the tags and the history behind them. The default shallow
          # clone has neither, and every build would call itself 0.0.0-dev.
          fetch-depth: 0

      # Before the eight minutes of build: a release that gets all the way to signing and
      # finds no key wasted them, and a release that silently published an unsigned bundle
      # would be worse.
      - name: The signing secrets must be present
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for name in UPLOAD_KEYSTORE_BASE64 UPLOAD_KEYSTORE_PASSWORD UPLOAD_KEY_ALIAS UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "Repository secrets not set:$missing" >&2
            echo "See section 4 of docs/DEVELOPMENT_PLAN.md for how the upload key is made." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The tag usually lands on a commit CI has already seen green. "Usually" is not a
      # guarantee, and a release is the wrong place to find out.
      - name: Style and tests
        run: ./gradlew ktlintCheck detekt build

      - name: Read the version the build derived
        id: version
        run: |
          set -euo pipefail
          ./gradlew -q :app:printVersion | grep -E '^version(Name|Code)=' >> "$GITHUB_OUTPUT"

      # Catches the whole family of "the artefact is not what the tag says": a tree that
      # was not clean, a checkout that lost its tags, a describe that landed on a different
      # one. Cheap here, unfixable once the bundle is on Play.
      - name: The tag and the built version must agree
        env:
          BUILT: ${{ steps.version.outputs.versionName }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME#v}" != "$BUILT" ]; then
            echo "Tag ${GITHUB_REF_NAME}, but the build derived ${BUILT}." >&2
            exit 1
          fi

      - name: Decode the upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # Outside the checkout on purpose. Inside it, the keystore would be an untracked
          # file, `git status` would call the tree dirty, the version would become
          # `X.Y.Z-dirty`, and the check above would fail on a perfectly good tag.
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build the signed bundle and a debug APK
        env:
          UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleDebug

      # An unsigned bundle builds perfectly well and is rejected by Play, hours later, by
      # hand. The build is told to sign; this is what checks that it did.
      - name: The bundle must actually be signed
        run: |
          set -euo pipefail
          bundle=$(ls app/build/outputs/bundle/release/*.aab)
          verdict=$(jarsigner -verify "$bundle")
          case "$verdict" in
            *"jar verified"*) echo "Signed: $bundle" ;;
            *) echo "Not signed: $bundle — $verdict" >&2; exit 1 ;;
          esac

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Collect the artefacts
        env:
          VERSION: ${{ steps.version.outputs.versionName }}
        run: |
          set -euo pipefail
          mkdir -p artefactos
          # The bundle is what goes to Play. The APK is signed with the debug key and
          # installs on a phone unchanged, which is what testers actually want.
          cp app/build/outputs/bundle/release/*.aab "artefactos/throwing-bambu-${VERSION}.aab"
          cp app/build/outputs/apk/debug/*.apk "artefactos/throwing-bambu-${VERSION}-debug.apk"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            artefactos/*
