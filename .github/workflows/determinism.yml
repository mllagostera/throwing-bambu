name: Determinism

# Called by ci.yml and by release.yml rather than copied into both. Determinism (§17.1)
# cannot be checked on a single JVM: these are the same fingerprint tests the Linux job
# already ran, on a second operating system, where a floating-point divergence surfaces as a
# failing test instead of as a networking bug in M6.
#
# `workflow_call` means this never runs on its own, so it appears in the Actions tab with no
# runs of its own. That is expected.
on:
  workflow_call:

jobs:
  determinism:
    runs-on: macos-latest
    steps:
      # Shallow on purpose: this job publishes nothing, so it has no use for the tags the
      # version is derived from.
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: ':core tests on a different JVM'
        run: ./gradlew :core:test
